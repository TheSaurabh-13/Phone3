<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>Phone3</title>
<link rel="stylesheet" href="style53.css"><link rel="manifest" href="manifest.json">
</head>
<body>
<div class="bg-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
<main class="app">
<section id="home-screen" class="screen home-screen">
  <div class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="home-search-input" type="search" placeholder="Search contacts" autocomplete="off"><button id="clear-home-search" class="mini-icon" hidden>×</button><button id="voice-search-btn" class="mic-btn" aria-label="Voice search"><svg class="mic-icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button></div>
  <div class="filter-row"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Missed">Missed</button><button class="filter" data-filter="Contacts">Contacts</button><button class="filter" data-filter="Non-spam">Non-spam</button></div>
  <section class="content-section"><div class="section-heading"><h2>Favourites <span>⌃</span></h2><button id="view-contacts-btn">View contacts</button></div><div id="favourites-list" class="favourites"></div></section>
  <section class="content-section"><div class="section-heading recent-heading"><h2>Recent</h2><button id="clear-recents-btn" class="text-button">Clear</button></div><div id="recent-list" class="recent-list"></div></section>
</section>

<section id="dialer-screen" class="screen dialer-screen">
  <div id="dialer-context" class="dialer-context">
    <div id="suggested-panel" class="suggested-panel"><h2>Suggested</h2><div id="suggested-list" class="suggested-list"></div></div>
    <div id="number-actions" class="number-actions" hidden>
      <button class="number-action" data-action="create"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 21a8 8 0 0 1 16 0"/><path d="M19 14v6M16 17h6"/></svg></span><span>Create new contact</span></button>
      <button class="number-action" data-action="add"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 21a8 8 0 0 1 16 0"/><path d="M19 14v6M16 17h6"/></svg></span><span>Add to a contact</span></button>
      <button class="number-action" data-action="video"><span class="action-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg></span><span>Video call</span></button>
      <button class="number-action" data-action="message"><span class="action-icon"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 3v-7.5A7.5 7.5 0 1 1 20 11.5Z"/></svg></span><span>Send a message</span></button>
    </div>
  </div>
  <div class="dialer-number-wrap"><div id="number-display" class="number-display"></div><button id="delete-btn" class="delete-btn" aria-label="Delete">⌫</button></div>
  <div class="dial-pad">
    <button class="dial-btn" data-number="1"><strong>1</strong></button><button class="dial-btn" data-number="2"><strong>2</strong><span>ABC</span></button><button class="dial-btn" data-number="3"><strong>3</strong><span>DEF</span></button>
    <button class="dial-btn" data-number="4"><strong>4</strong><span>GHI</span></button><button class="dial-btn" data-number="5"><strong>5</strong><span>JKL</span></button><button class="dial-btn" data-number="6"><strong>6</strong><span>MNO</span></button>
    <button class="dial-btn" data-number="7"><strong>7</strong><span>PQRS</span></button><button class="dial-btn" data-number="8"><strong>8</strong><span>TUV</span></button><button class="dial-btn" data-number="9"><strong>9</strong><span>WXYZ</span></button>
    <button class="dial-btn" data-number="*"><strong>*</strong></button><button class="dial-btn" data-number="0"><strong>0</strong><span>+</span></button><button class="dial-btn" data-number="#"><strong>#</strong></button>
  </div>
  <button id="call-btn" class="call-btn" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.56.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.16 21 3 13.84 3 5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.56 1 1 0 0 1-.24 1.02z"/></svg></button>
</section>

<div id="contacts-sheet" class="overlay" aria-hidden="true"><div class="sheet-backdrop" data-close-contacts></div><section class="sheet-panel contacts-panel"><div class="sheet-handle"></div><div class="sheet-heading"><div><span class="eyebrow">PHONE3</span><h2>Contacts</h2></div><button class="close-sheet" data-close-contacts>×</button></div><div class="sheet-toolbar"><div class="contact-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="contact-search-input" placeholder="Search contacts" autocomplete="off"></div><button id="new-contact-from-list" class="round-add">+</button></div><div id="contacts-list" class="contacts-list"></div></section></div>

<div id="create-sheet" class="overlay" aria-hidden="true"><div class="sheet-backdrop" data-close-create></div><section class="sheet-panel form-panel"><div class="sheet-handle"></div><div class="sheet-heading"><div><span class="eyebrow">CONTACT</span><h2 id="create-title">Create new contact</h2></div><button class="close-sheet" data-close-create>×</button></div><label>Name<input id="create-name" type="text" placeholder="Contact name"></label><label>Phone number<input id="create-number" type="tel" inputmode="tel" placeholder="Phone number"></label><label>Avatar color<div id="avatar-picker" class="avatar-picker"><button type="button" class="avatar-choice pink selected" data-avatar="pink">A</button><button type="button" class="avatar-choice magenta" data-avatar="magenta">A</button><button type="button" class="avatar-choice purple" data-avatar="purple">A</button></div></label><div class="form-actions"><button id="create-cancel" class="secondary-btn">Cancel</button><button id="create-save" class="primary-btn">Save</button></div></section></div>

<div id="detail-sheet" class="overlay" aria-hidden="true"><div class="sheet-backdrop" data-close-detail></div><section class="sheet-panel detail-panel"><button class="detail-close close-sheet" data-close-detail>×</button><div id="detail-avatar" class="detail-avatar purple">?</div><h2 id="detail-name">Contact</h2><p id="detail-number">Mobile • —</p><div class="detail-actions"><button id="detail-call" class="detail-action"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.56.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.16 21 3 13.84 3 5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.56 1 1 0 0 1-.24 1.02z"/></svg><small>Call</small></button><button id="detail-video" class="detail-action"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg><small>Video</small></button><button id="detail-message" class="detail-action"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 3v-7.5A7.5 7.5 0 1 1 20 11.5Z"/></svg><small>Message</small></button></div><button id="detail-favourite" class="favourite-toggle">☆ Add to favourites</button><button id="detail-edit" class="wide-detail-btn">Edit contact</button><button id="detail-delete" class="wide-detail-btn danger">Delete contact</button></section></div>

<div id="call-screen" class="call-screen" aria-hidden="true"><div class="call-bg-orb orb-a"></div><div class="call-bg-orb orb-b"></div><div class="call-content"><button id="call-back" class="call-back">‹</button><div class="call-rings"><div class="ring ring-1"></div><div class="ring ring-2"></div><div id="calling-avatar" class="calling-avatar purple">?</div></div><h2 id="calling-name">Unknown</h2><p id="calling-number">Mobile • —</p><div class="calling-status"><span class="pulse-dot"></span><span id="calling-status-text">Calling…</span></div><div class="call-controls"><button class="call-control" id="mute-demo"><span>⌁</span><small>Mute</small></button><button class="call-control end" id="end-call"><span>☎</span><small>End</small></button><button class="call-control" id="keypad-demo"><span>⠿</span><small>Keypad</small></button></div></div></div>

<div id="in-call-pad" class="in-call-pad" aria-hidden="true"><div class="in-call-pad-card"><div class="in-call-pad-head"><strong>In-call keypad</strong><button id="close-in-call-pad">×</button></div><div id="in-call-display" class="in-call-display"></div><div class="in-call-grid"><button data-in-call="1">1</button><button data-in-call="2">2</button><button data-in-call="3">3</button><button data-in-call="4">4</button><button data-in-call="5">5</button><button data-in-call="6">6</button><button data-in-call="7">7</button><button data-in-call="8">8</button><button data-in-call="9">9</button><button data-in-call="*">*</button><button data-in-call="0">0</button><button data-in-call="#">#</button></div></div></div><div id="settings-sheet" class="sheet" aria-hidden="true"><div class="sheet-card"><div class="sheet-head"><strong>Phone3 settings</strong><button data-close-settings>×</button></div><div class="settings-list"><button id="export-data">Export contacts & call history</button><button id="import-data">Import backup</button><button id="clear-data" class="danger-action">Reset Phone3 data</button><input id="import-file" type="file" accept="application/json" hidden></div></div></div><div id="toast" class="toast" role="status"></div>
</main>
<nav id="nav" class="liquid-nav"><div class="liquid-glare-container"><div class="liquid-glare" id="glare"></div></div><div class="nav-items"><div id="active-pill" class="active-pill"></div><button class="nav-btn active" data-page="home"><div class="btn-content"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></div></button><button class="nav-btn" data-page="keypad"><div class="btn-content"><svg viewBox="0 0 24 24"><circle cx="7" cy="5" r="1.3"/><circle cx="12" cy="5" r="1.3"/><circle cx="17" cy="5" r="1.3"/><circle cx="7" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="17" cy="12" r="1.3"/><circle cx="7" cy="19" r="1.3"/><circle cx="12" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg><span>Keypad</span></div></button></div><div class="divider"></div><button id="settings-btn" class="theme-btn settings-trigger" aria-label="Settings">⚙</button><button id="theme-btn" class="theme-btn"><svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg><svg class="moon-icon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5z"/></svg></button></nav>
<script src="script53.js"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
</html>
